name: simple-workflow
on:
    push:
        branches:
            - main
            - 'feature/**'
            - 'dev-*'
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6
            - name: show-Info
              run: | 
                echo "hello World!!"
                echo "add some dumy artifact to file" > file-artifact.txt
            - name: Get Artifact
              uses: actions/upload-artifact@v7
              with:
                - name: artifact-file
                  path: file-artifact.txt
    
    Deploy:
        runs-on: ubuntu-latest
        steps:
           - name: Download Artifact 
             uses: actions/download-artifact@8
             with:
                name :artifact-file
           - name: show artifact
             run: ls -l 
             
